<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main">
        <form id="cardForm">
            <input type="text" id="picInput" placeholder="Profile Pic URL">
            <input type="text" id="nameInput" placeholder="Name">
            <input type="text" id="occInput" placeholder="Occupation">
            <input type="text" id="infoInput" placeholder="Info">
            <input type="submit" value="Generate Card">
        </form>

        <div class="card-container" id="cardsHolder"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
